services:
  - example-service

service_pages:
  page_id: "123456789"
  category: "application"
  source_service: "example-service"
  source_repo: "example-repo"
  label: "Example service overview and operating context"
  # Optional: keep a short entry for this service on its parent Confluence page.
  # Only this service's entry, in a marked "Services in this area" section, is
  # ever changed; the rest of the parent page is left as it is. The parent is the
  # page's direct parent unless parent_page_id names another one.
  # parent_summary: true
  # parent_page_id: "123456000"
# Optional topology metadata for services managed by more than one repository.
# This helps the model understand shared-service boundaries when generating Confluence updates.
# service_repo_topology:
#   mode: "multi_repo"  # single_repo | multi_repo
#   shared_service_name: "Example Shared App"
#   confluence_guidance: "Represent the combined service view across frontend + backend repos."
#   managed_repos:
#     - repo: "example-backend-repo"
#       service: "example-service"
#       role: "backend"
#     - repo: "example-frontend-repo"
#       service: "example-frontend"
#       role: "frontend"
#       notes: "Owns UI flows and web client behavior."
#
# For simple services, you can omit this block (single_repo default behavior).

